<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fafafa">
    <title>Page not found | frasharp</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("frasharp-theme");
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme =
          savedTheme === "dark" || savedTheme === "light" ? savedTheme : preferredTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="/assets/css/site.css">
    <script src="/assets/js/site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header site-shell">
      <a class="wordmark" href="/" aria-label="frasharp, home">frasharp</a>
      <nav class="header-nav" aria-label="Main">
        <a href="https://github.com/FraSharp" rel="me">GitHub <span aria-hidden="true">↗</span></a>
        <a href="/#projects">Projects</a>
        <a href="/about/">About</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" aria-pressed="false" hidden>
        <span data-theme-icon aria-hidden="true">◐</span>
      </button>
    </header>
    <main class="site-shell" id="main">

      <header class="page-heading">
        <p class="back-link"><a href="/"><span aria-hidden="true">←</span> Home</a></p>
        <h1>Page not found</h1>
        <p>This address doesn’t point to a page on this site.</p>
      </header>
      <p><a href="/">Return to the homepage</a></p>
    </main>
    <footer class="site-shell site-footer">
      <p>&copy; <span data-current-year>2026</span> frasharp</p>
    </footer>
  </body>
</html>
